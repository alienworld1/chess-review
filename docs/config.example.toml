# Optional advanced product configuration. Paste into Settings → Advanced,
# then validate and save. Missing fields use these defaults.
# Budgets and thresholds are provisional tuning values, not calibrated guarantees.
version = 1

# Show technical details in supported views.
# This only changes presentation; review results and cache reuse are unchanged.
[ui]
verbose = false

[analysis]
# Uncomment to set a default line count for Analyze instead of using its last choice.
# liveMultiPv = 3

[analysis.fast]
quickScanNodes = 50000
deepeningNodes = 150000
verificationNodes = 300000

[analysis.standard]
quickScanNodes = 50000
deepeningNodes = 250000
verificationNodes = 500000

[analysis.thorough]
quickScanNodes = 250000
deepeningNodes = 3000000
verificationNodes = 10000000

[classification]
excellentLoss = 0.01
inaccuracyLoss = 0.05
mistakeLoss = 0.10
blunderLoss = 0.20

[review]
quality = "standard"
preferWdl = true

[expectedScore]
fallbackScaleCp = 300

# Fractions of expected score: 0.01 means one percentage point.
[refinement]
# New runs use this for candidate selection and classification stability.
# Both compared losses must clear applicable cutoffs by more than this margin.
# Zero still protects the exact cutoff. Default non-best Excellent stays provisional.
boundaryMargin = 0.01
maximumDrift = 0.02
multiPv = 3

# Conservative special-label rules for new adaptive reviews (pipeline 11).
# Losses, gaps and margins are fractions of mover-perspective expected score.
[special]
maximumLoss = 0.01
maximumLossDrift = 0.01
alternativeGap = 0.10
missLoss = 0.10
viableScore = 0.50
alreadyWinningScore = 0.95
margin = 0.01
sacrificeValue = 2

# The local book is a prefix of the mainline, bounded in half-moves.
[openings]
enabled = true
maximumPly = 24
minimumReferences = 2

[puzzles]
automatic = true
maximumPlayerMoves = 4
maximumPositions = 64
maximumBudgetUnits = 64
minimumMaterialGain = 2
immediateMaterialGain = 5
