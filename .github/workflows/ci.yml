name: Linux validation

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Qt 6.12 Debug and tooling
            qt: '6.12.0'
            preset: dev
            compiler: g++
            tooling: true
          - name: Qt 6.12 Release
            qt: '6.12.0'
            preset: release
            compiler: g++
          - name: Qt 6.12 ASan and UBSan
            qt: '6.12.0'
            preset: sanitized
            compiler: clang++-18
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Install build and Qt tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build clang-18 clang-format-18 clang-tidy-18 libgl1-mesa-dev libxkbcommon-x11-0 libxcb-cursor0 libegl1
          python3 -m venv "$RUNNER_TEMP/aqt"
          "$RUNNER_TEMP/aqt/bin/pip" install aqtinstall==3.3.0
          "$RUNNER_TEMP/aqt/bin/aqt" install-qt linux desktop '${{ matrix.qt }}' linux_gcc_64 -O "$RUNNER_TEMP/Qt" --archives qtbase icu qtsvg
      - name: Configure
        run: >-
          cmake --preset '${{ matrix.preset }}'
          -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/${{ matrix.qt }}/gcc_64"
          -DCMAKE_CXX_COMPILER='${{ matrix.compiler }}'
          -DCHESS_REVIEW_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset '${{ matrix.preset }}' --parallel 2
      - name: Test
        run: ctest --preset '${{ matrix.preset }}' --parallel 2 --output-junit "$GITHUB_WORKSPACE/build/${{ matrix.preset }}/junit.xml"
      - name: Build without test dependencies
        if: matrix.tooling
        run: |
          cmake -S . -B build/app-only -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/Qt/${{ matrix.qt }}/gcc_64" \
            -DCHESS_REVIEW_WARNINGS_AS_ERRORS=ON
          cmake --build build/app-only --parallel 2
      - name: Formatting
        if: matrix.tooling
        run: find src tests -type f \( -name '*.cpp' -o -name '*.h' \) -exec clang-format-18 --dry-run --Werror {} +
      - name: Static analysis
        if: matrix.tooling
        run: find src tests -type f -name '*.cpp' -exec clang-tidy-18 -p build/dev {} +
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.qt }}-${{ matrix.preset }}
          path: |
            build/${{ matrix.preset }}/Testing/Temporary/
            build/${{ matrix.preset }}/junit.xml
          if-no-files-found: ignore
          retention-days: 7
